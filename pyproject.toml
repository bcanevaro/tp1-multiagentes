[project]
name = "mas-tp-tablas"
version = "0.1.0"
description = "QA multiagente sobre tablas en PDFs (LangGraph + Pinecone + Streamlit)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langsmith>=0.4",
    "pinecone>=7.0",
    "streamlit>=1.40",
    "pymupdf>=1.26",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "docker>=7.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
    "reportlab>=4.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"  # igual que .python-version; los stubs de numpy usan sintaxis 3.12
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
# PyMuPDF casi no trae anotaciones de tipos: se permiten llamadas a sus funciones sin tipar.
untyped_calls_exclude = ["pymupdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: requiere un daemon de Docker y la imagen del sandbox",
]
