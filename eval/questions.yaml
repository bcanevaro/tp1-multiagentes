# Preguntas de prueba del Analista (consigna §9.2).
#
# Campos:
#   id               identificador estable (se usa como metadato de la traza en LangSmith)
#   doc              PDF de data/sample_pdfs/ que tiene que estar ingerido
#   question         pregunta en lenguaje natural
#   expected_status  answered | partial | cannot_answer
#   expected_values  resultados numéricos esperados (vacío en cannot_answer). Cada uno tiene
#                    `value` (un número) o `values` (un número por categoría), y `unit`.
#   expected_missing qué dato falta (partial / cannot_answer), en palabras
#   tables           tablas que debería usar (por su número de cuadro en el PDF)
#   kind             qué tipo de caso cubre
#
# Los valores esperados del PDF sintético se verifican contra scripts/sample_data.py en
# tests/test_questions.py. Tolerancia de corrección: 0,5 % relativa.

questions:
  - id: syn-01
    doc: informe_sintetico.pdf
    question: "¿Cuál fue el promedio simple de las variaciones interanuales de los ingresos totales del sector público entre 2019 y 2023?"
    expected_status: answered
    expected_values:
      - label: "Promedio de las variaciones interanuales de los ingresos totales 2019-2023"
        value: 84.8792
        unit: "%"
    tables: ["Cuadro 1"]
    kind: una tabla; promedio de variaciones interanuales (2020, 2021, 2022 y 2023)
    notes: "Variaciones: 32,57 %; 52,52 %; 90,32 %; 164,10 %. Promedio aritmético. Antes decía 'crecimiento interanual promedio', que el LLM leyó como tasa compuesta (78,55 %); se reformuló para quitar la ambigüedad."

  - id: syn-02
    doc: informe_sintetico.pdf
    question: "¿Qué proporción de los gastos totales representó el gasto en ciencia y tecnología en cada año?"
    expected_status: answered
    expected_values:
      - label: "Gasto en ciencia y tecnología / gastos totales"
        unit: "%"
        values: {"2019": 1.1311, "2020": 1.0707, "2021": 1.1709, "2022": 1.2330, "2023": 1.1531}
    tables: ["Cuadro 1"]
    kind: una tabla; resultado por categoría

  - id: syn-03
    doc: informe_sintetico.pdf
    question: "¿Cuál fue el resultado financiero del sector público provincial en 2024?"
    expected_status: cannot_answer
    expected_values: []
    expected_missing: "La tabla de finanzas públicas cubre 2019-2023; 2024 no está disponible."
    tables: ["Cuadro 1"]
    kind: falta un período

  - id: syn-04
    doc: informe_sintetico.pdf
    question: "¿Qué departamento tuvo la tasa de desempleo más alta en 2023, y por cuánto superó al promedio provincial?"
    expected_status: partial
    expected_values:
      - label: "Departamento con mayor desempleo en 2023 (Norte)"
        value: 9.8
        unit: "%"
    expected_missing: "Ninguna tabla informa un promedio provincial de desempleo; no se reemplaza por el promedio de los departamentos."
    tables: ["Cuadro 2"]
    kind: falta un valor de comparación

  - id: syn-05
    doc: informe_sintetico.pdf
    question: "¿Cuál fue la producción de soja por habitante en cada departamento en 2023?"
    expected_status: answered
    expected_values:
      - label: "Producción de soja 2023 por habitante"
        unit: "toneladas por habitante"
        values: {"Capital": 0.0165, "Norte": 3.8133, "Valle Alto": 2.0282, "Llanura": 7.5654, "Costa Sur": 1.1978}
    tables: ["Cuadro 4", "Cuadro 5"]
    kind: multitabla; cambio de escala (miles de toneladas -> toneladas)

  - id: syn-06
    doc: informe_sintetico.pdf
    question: "¿Cuál fue la tasa de desempleo de la provincia en 2023 calculada como el promedio de los departamentos ponderado por su población?"
    expected_status: answered
    expected_values:
      - label: "Desempleo 2023 ponderado por población"
        value: 7.4926
        unit: "%"
    tables: ["Cuadro 2", "Cuadro 5"]
    kind: multitabla; la pregunta define explícitamente cómo calcular el promedio (excepción a la regla del valor de comparación)

  - id: syn-07
    doc: informe_sintetico.pdf
    question: "¿Qué porcentaje de los ingresos totales del sector público de 2023 representaron las exportaciones de ese año expresadas en pesos?"
    expected_status: cannot_answer
    expected_values: []
    expected_missing: "Las exportaciones están en US$ y los ingresos en pesos; no hay ninguna tabla con el tipo de cambio."
    tables: ["Cuadro 1", "Cuadro 6"]
    kind: conversión de unidades que requiere datos externos

  - id: syn-08
    doc: informe_sintetico.pdf
    question: "¿Cuál fue el total de exportaciones de la provincia en 2023, en millones de dólares?"
    expected_status: answered
    expected_values:
      - label: "Exportaciones totales 2023"
        value: 956.6873
        unit: "millones de US$"
    tables: ["Cuadro 6"]
    kind: tabla multipágina; suma de los 12 meses y cambio de escala (miles -> millones)

  - id: syn-09
    doc: informe_sintetico.pdf
    question: "¿Cuánto creció el salario real promedio del sector industria entre 2021 y 2023?"
    expected_status: cannot_answer
    expected_values: []
    expected_missing: "La tabla de salarios no indica si los valores son nominales o reales y no hay un índice de precios para deflactar."
    tables: ["Cuadro 3"]
    kind: ambigüedad nominal/real

  - id: syn-10
    doc: informe_sintetico.pdf
    question: "¿Cuántos turistas visitaron la provincia en 2023?"
    expected_status: cannot_answer
    expected_values: []
    expected_missing: "Ninguna tabla indexada tiene datos de turismo."
    tables: []
    kind: ninguna tabla relacionada

  - id: syn-11
    doc: informe_sintetico.pdf
    question: "¿Cuál fue la tasa de desempleo del departamento Río Seco en 2023?"
    expected_status: cannot_answer
    expected_values: []
    expected_missing: "La tabla de desempleo incluye Capital, Norte, Valle Alto, Llanura y Costa Sur; Río Seco no está."
    tables: ["Cuadro 2"]
    kind: falta una entidad

  # ---------------------------------------------------------------------------------------
  # PDF real: INDEC, Intercambio comercial argentino (indec_ica.pdf, cifras de agosto de 2026).
  # Valores calculados con las cifras publicadas (millones de USD) y verificados contra el PDF
  # por el alumno; tests/test_questions.py los recalcula desde las tablas extraídas.
  # ---------------------------------------------------------------------------------------

  - id: ind-01
    doc: indec_ica.pdf
    question: "¿Qué porcentaje de las exportaciones argentinas acumuladas hasta agosto de 2026 se originó en la provincia de Santa Fe?"
    expected_status: answered
    expected_values:
      - label: "Participación de Santa Fe en las exportaciones acumuladas a agosto de 2026"
        value: 20.4408
        unit: "%"
    tables: ["Cuadro 10"]
    kind: una tabla real; cociente entre una fila y el total (13.746 / 67.248)

  - id: ind-02
    doc: indec_ica.pdf
    question: "¿Cuál fue el saldo comercial promedio mensual entre enero y agosto de 2026?"
    expected_status: answered
    expected_values:
      - label: "Saldo comercial promedio mensual enero-agosto 2026"
        value: 2281.25
        unit: "millones de USD"
    tables: ["Cuadro 1"]
    kind: una tabla real; promedio de 8 meses
    notes: "Saldos mensuales 2026: 2.189; 797; 2.581; 2.713; 3.450; 2.235; 2.098; 2.187 (suma 18.250). Con el acumulado publicado (18.249) da 2.281,1, dentro de la tolerancia."

  - id: ind-03
    doc: indec_ica.pdf
    question: "¿Qué porcentaje de las exportaciones totales de agosto de 2026 correspondió al sector automotriz?"
    expected_status: answered
    expected_values:
      - label: "Exportaciones del sector automotriz / exportaciones totales, agosto de 2026"
        value: 9.8840
        unit: "%"
    tables: ["Cuadro 7", "Cuadro 1"]
    kind: multitabla real; exportaciones automotrices (878) sobre el total del mes (8.883)

  - id: ind-04
    doc: indec_ica.pdf
    question: "¿Cuánto exportó la Argentina en septiembre de 2026?"
    expected_status: cannot_answer
    expected_values: []
    expected_missing: "El informe llega hasta agosto de 2026; septiembre solo tiene datos de 2025."
    tables: ["Cuadro 1"]
    kind: falta un período (la fila existe, pero sin dato para 2026)

  - id: ind-05
    doc: indec_ica.pdf
    question: "¿Cuánto exportó la región Patagonia en agosto de 2026 y cuánto creció respecto de agosto de 2025?"
    expected_status: partial
    expected_values:
      - label: "Exportaciones de la región Patagonia, agosto de 2026"
        value: 1469
        unit: "millones de USD"
    expected_missing: "El origen de las exportaciones por región solo se publica para 2026; no hay dato de Patagonia en agosto de 2025."
    tables: ["Cuadro 9"]
    kind: falta un período para una parte de la pregunta

  # ---------------------------------------------------------------------------------------
  # PDF real: INDEC, Índice de precios al consumidor (indec_ipc.pdf, cifras de agosto de 2026).
  # Valores verificados contra el texto del PDF (Cuadros 1, 2 y 3).
  # ---------------------------------------------------------------------------------------

  - id: ipc-01
    doc: indec_ipc.pdf
    question: "¿Cuál fue la variación mensual del IPC nivel general a nivel nacional en agosto de 2026?"
    expected_status: answered
    expected_values:
      - label: "Variación mensual del IPC nivel general nacional, agosto de 2026"
        value: 1.7
        unit: "%"
    tables: ["Cuadro 1"]
    kind: una tabla real; dato directo

  - id: ipc-02
    doc: indec_ipc.pdf
    question: "En agosto de 2026, ¿qué región tuvo la mayor variación mensual en Vivienda, agua, electricidad, gas y otros combustibles, y por cuántos puntos superó al dato nacional?"
    expected_status: answered
    expected_values:
      - label: "Mayor variación mensual en Vivienda, agua, electricidad, gas y otros combustibles (Noreste)"
        value: 4.0
        unit: "%"
      - label: "Diferencia con la variación nacional (2,8 %)"
        value: 1.2
        unit: "puntos porcentuales"
    tables: ["Cuadro 1"]
    kind: una tabla real; máximo entre regiones y diferencia con un valor de comparación que sí está en la tabla

  - id: ipc-03
    doc: indec_ipc.pdf
    question: "¿Cuántos puntos porcentuales de diferencia hubo entre la variación interanual y la variación acumulada del año del IPC nivel general nacional en agosto de 2026?"
    expected_status: answered
    expected_values:
      - label: "Variación interanual (33,5 %) menos variación acumulada desde diciembre de 2025 (21,3 %)"
        value: 12.2
        unit: "puntos porcentuales"
    tables: ["Cuadro 3", "Cuadro 2"]
    kind: multitabla real; cada medida está en un cuadro distinto

  - id: ipc-04
    doc: indec_ipc.pdf
    question: "¿Cuál fue la variación mensual del IPC en septiembre de 2026?"
    expected_status: cannot_answer
    expected_values: []
    expected_missing: "El informe llega hasta agosto de 2026; no hay datos de septiembre."
    tables: ["Cuadro 1"]
    kind: falta un período

  - id: ipc-05
    doc: indec_ipc.pdf
    question: "¿Cuál fue la variación mensual del IPC en la provincia de Córdoba en agosto de 2026?"
    expected_status: cannot_answer
    expected_values: []
    expected_missing: "El IPC se publica por regiones (GBA, Pampeana, Noreste, Noroeste, Cuyo, Patagonia), no por provincia; no se reemplaza por la región Pampeana."
    tables: ["Cuadro 1"]
    kind: falta una entidad (existe una entidad cercana que no se debe usar)

  - id: ipc-06
    doc: indec_ipc.pdf
    question: "¿Cuál fue la variación mensual del IPC nivel general nacional en agosto y en septiembre de 2026?"
    expected_status: partial
    expected_values:
      - label: "Variación mensual del IPC nivel general nacional, agosto de 2026"
        value: 1.7
        unit: "%"
    expected_missing: "No hay datos de septiembre de 2026."
    tables: ["Cuadro 1"]
    kind: falta un período para una parte de la pregunta
